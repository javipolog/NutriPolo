name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Catàleg de Mercadona (fora de git): es genera aquí perquè l'instal·lador el porti.
      # Si en surten menys de 250 aliments, la release s'atura en lloc de publicar-se sense.
      - name: Import Mercadona food catalog
        shell: bash
        run: |
          node scripts/catalog/import-mercadona.mjs
          node -e "
            const n = require('./public/catalog/foods.json').alimentos.length;
            const imgs = require('fs').readdirSync('public/catalog/images').length;
            console.log('Catalog:', n, 'foods,', imgs, 'images');
            if (n < 250 || imgs < 250) { console.error('Mercadona catalog incomplete'); process.exit(1); }
          "

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'NutriPolo v__VERSION__'
          releaseBody: 'Descarga el instalador MSI para actualizar.'
          releaseDraft: false
          prerelease: false
