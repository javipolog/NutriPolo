[package]
name = "nutripolo-app"
version = "1.14.0"
description = "Aplicación de gestión de consulta nutricional"
authors = ["Javier Polo García"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "updater", "process-relaunch", "dialog-open", "dialog-save", "fs-read-file", "fs-write-file", "fs-create-dir", "path-all", "shell-open", "system-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
urlencoding = "2"
rand = "0.8"
sha2 = "0.10"
keyring = "2.3"
aes-gcm = "0.10"
argon2 = "0.5"
zeroize = { version = "1.8", features = ["derive"] }
auto-launch = "0.5"
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1e407ed56455558cf751022fd68eca3b9e3713a0" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Smaller, faster installer build (slower to compile).
[profile.release]
lto = true
codegen-units = 1
strip = true
